<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Knew It! 💖</title>
    <style>
        body {
            background-color: #ffb6c1; /* Full Pink Background */
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Prevents horizontal scroll from tilted photos */
        }

.side-photos {
            position: fixed;
            top: 0;
            width: 220px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            z-index: 1;
        }

        .left-side { left: 10px; }
        .right-side { right: 10px; }

        .side-photos img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border: 6px solid white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        /* Scrapbook Tilt Effects */
        .left-side img:nth-child(1) { transform: rotate(-5deg); }
        .left-side img:nth-child(2) { transform: rotate(3deg); }
        .left-side img:nth-child(3) { transform: rotate(-2deg); }
        
        .right-side img:nth-child(1) { transform: rotate(4deg); }
        .right-side img:nth-child(2) { transform: rotate(-6deg); }
        .right-side img:nth-child(3) { transform: rotate(2deg); }

        .side-photos img:hover {
            transform: scale(1.1) rotate(0deg);
            z-index: 10;
        }


        .video-card {
            background: white;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 700px; /* Limits the width for quality */
            width: 100%;
            border: 8px solid #fff0f3;
        }

        h1 { 
            color: #ff4d6d; 
            margin-bottom: 10px;
            font-size: 2rem;
        }

        /* Video Container for perfect centering and quality */
        .video-wrapper {
            width: 100%;
            border-radius: 20px;
            overflow: hidden; /* Rounds the video corners */
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.2);
            background-color: #000; /* Black bars if video ratio is different */
            margin: 20px 0;
        }

        video {
            width: 100%; 
            height: auto; 
            display: block; /* Removes bottom spacing */
            max-height: 70vh; /* Prevents video from being taller than the screen */
        }

        

        




        .hearts {
            font-size: 24px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="side-photos left-side">
        <img src="pic 1.jpeg" alt="Photo 1">
        <img src="pic2.jpeg" alt="Photo 2">
        <img src="pic 3.jpeg" alt="Photo 3">
    </div>


    <div class="video-card">
        <h1>YES! YOU ARE MINE NOW! 💖</h1>
<P> As you listen to the peom below, know i made this with soo much LOVE <br>
and a smile on my face, once had the biggest crush on you, maybe i still do MAAME</P>
        <div class="video-wrapper">
            <video controls autoplay loop playsinline>
                <source src="my-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="side-photos right-side">
        <img src="pic 4.jpeg" alt="Photo 4">
        <img src="pic 5.jpeg" alt="Photo 5">
        <img src="pic6.jpeg" alt="Photo 6">
    </div>

        <div class="hearts">call 🌸 me  ✨when  💞you  ✨ can 🌸</div>
    </div>

</body>
</html>
